# Identificação — ajuste projectKey e organization pro seu projeto
sonar.projectKey=bythealice_mvvm-template
sonar.projectName=mvvm-template
sonar.organization=bythealice

# Fontes e testes
sonar.sources=src
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.cy.ts,**/*.cy.tsx

# Exclusões — node_modules, gerados, e2e de infraestrutura
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/cypress/**,\
  src/app/**,\
  src/core/providers/**

sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/cypress/**,\
  src/app/**,\
  src/shared/ui/**,\
  src/core/providers/**,\
  **/*.types.ts

# Coverage — gerado pelo vitest run --coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Quality Gate — bloqueia o merge se não passar
sonar.qualitygate.wait=true
